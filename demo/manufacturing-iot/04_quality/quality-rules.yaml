# =============================================================================
# 製造業 IoT デモ — データ品質ルール定義
# Generated by: data-quality-reviewer agent
# Target: silver.production_facts
# =============================================================================

table: silver.production_facts
description: "生産実績ファクトテーブルのデータ品質検証ルール（6次元）"
version: "1.0.0"
last_updated: "2026-03-15"

# =============================================================================
# 1. 完全性 (Completeness)
# =============================================================================
completeness:
  description: "必要なデータが欠けていないかを検証する"

  mandatory_columns:
    - column: production_date
      max_null_rate: 0.0
      description: "生産日（主キー構成要素。NULL 不可）"

    - column: line_id
      max_null_rate: 0.0
      description: "製造ライン ID（主キー構成要素。NULL 不可）"

    - column: product_code
      max_null_rate: 0.0
      description: "製品コード（主キー構成要素。NULL 不可）"

    - column: planned_quantity
      max_null_rate: 0.01
      description: "計画数量（1% 以下の欠損を許容）"

    - column: actual_quantity
      max_null_rate: 0.01
      description: "実績数量（1% 以下の欠損を許容）"

    - column: defect_quantity
      max_null_rate: 0.02
      description: "不良数量（2% 以下の欠損を許容。0 埋め補完対象）"

    - column: equipment_id
      max_null_rate: 0.01
      description: "設備 ID（1% 以下の欠損を許容）"

    - column: shift
      max_null_rate: 0.0
      description: "シフト区分（主キー構成要素。NULL 不可）"

    - column: operator_id
      max_null_rate: 0.05
      description: "作業者 ID（5% 以下の欠損を許容。無人運転時は NULL）"

    - column: temperature
      max_null_rate: 0.05
      description: "設備温度（5% 以下の欠損を許容。センサー欠測あり）"

    - column: vibration
      max_null_rate: 0.05
      description: "振動値（5% 以下の欠損を許容。センサー欠測あり）"

    - column: status
      max_null_rate: 0.0
      description: "設備状態（NULL 不可）"

    - column: created_at
      max_null_rate: 0.0
      description: "レコード作成日時（NULL 不可）"

  record_count:
    min_expected: 500
    max_expected: 1500
    description: "日次の想定レコード数（500〜1,500 件）"

# =============================================================================
# 2. 正確性 (Accuracy)
# =============================================================================
accuracy:
  description: "データが現実世界の値を正しく反映しているかを検証する"

  range_checks:
    - column: planned_quantity
      min: 0
      max: 100000
      description: "計画数量は 0 以上 100,000 以下"

    - column: actual_quantity
      min: 0
      max: 100000
      description: "実績数量は 0 以上 100,000 以下"

    - column: defect_quantity
      min: 0
      max: 100000
      description: "不良数量は 0 以上 100,000 以下"

    - column: temperature
      min: 20.0
      max: 80.0
      unit: "℃"
      description: "設備温度は 20〜80℃（工場内設備の正常稼働範囲）"

    - column: vibration
      min: 0.1
      max: 5.0
      unit: "mm/s"
      description: "振動値は 0.1〜5.0 mm/s（正常稼働範囲）"

  reference_checks:
    - column: line_id
      master_table: master.production_lines
      master_key: line_id
      description: "製造ライン ID がマスタに存在すること"

    - column: product_code
      master_table: master.products
      master_key: product_code
      description: "製品コードがマスタに存在すること"

    - column: equipment_id
      master_table: master.equipment
      master_key: equipment_id
      description: "設備 ID がマスタに存在すること"

    - column: operator_id
      master_table: master.operators
      master_key: operator_id
      allow_null: true
      description: "作業者 ID がマスタに存在すること（NULL 許容）"

# =============================================================================
# 3. 一貫性 (Consistency)
# =============================================================================
consistency:
  description: "複数カラム間で矛盾がないかを検証する"

  cross_field_rules:
    - name: "実績・不良数量の整合性"
      expression: "actual_quantity + defect_quantity <= planned_quantity * 1.1"
      description: |
        実績数量 + 不良数量 が 計画数量の 110% 以下であること。
        超過は計画ミスまたはデータ入力ミスの可能性がある。
      severity: warning

    - name: "不良数量は実績数量以下"
      expression: "defect_quantity <= actual_quantity"
      description: "不良数量が実績数量を超えることはない"
      severity: critical

    - name: "実績数量は計画数量の妥当範囲内"
      expression: "actual_quantity <= planned_quantity * 1.5"
      description: |
        実績数量が計画数量の 150% を超える場合は異常。
        残業・増産を考慮しても 150% は上限。
      severity: warning

    - name: "異常ステータスと温度の整合性"
      expression: |
        NOT (status = '異常' AND temperature BETWEEN 20 AND 60 AND vibration BETWEEN 0.1 AND 3.0)
      description: |
        設備ステータスが「異常」であれば、温度または振動のいずれかが
        正常範囲を逸脱しているはず。両方正常なのに「異常」は矛盾の可能性。
      severity: info

# =============================================================================
# 4. 適時性 (Timeliness)
# =============================================================================
timeliness:
  description: "データが期待される時間内に利用可能かを検証する"

  freshness:
    column: created_at
    max_age_hours: 24
    description: "最新レコードの created_at が 24 時間以内であること"

  delivery_sla:
    deadline: "08:00 JST"
    max_delay_hours: 2
    description: |
      毎日 AM 8:00 JST までに前日データが Silver レイヤーに到達すること。
      最大 2 時間（AM 10:00 JST まで）の遅延を許容。

  data_date_check:
    column: production_date
    expected: "T-1"
    description: "production_date に前日の日付データが含まれていること"

# =============================================================================
# 5. 一意性 (Uniqueness)
# =============================================================================
uniqueness:
  description: "データに意図しない重複がないかを検証する"

  unique_keys:
    - columns:
        - production_date
        - line_id
        - product_code
        - shift
      description: "生産日 + ライン + 製品 + シフトの組み合わせで一意"
      on_duplicate: reject_latest
      dedup_strategy: "重複時は created_at が古いレコードを正とする"

  near_duplicate_detection:
    enabled: true
    time_window_minutes: 5
    key_columns:
      - line_id
      - product_code
    description: "同一ライン・製品で 5 分以内のレコードは重複の疑い"

# =============================================================================
# 6. 有効性 (Validity)
# =============================================================================
validity:
  description: "データが定義されたフォーマットやルールに従っているかを検証する"

  enum_checks:
    - column: status
      allowed_values:
        - "正常"
        - "警告"
        - "異常"
        - "停止"
      description: "設備ステータスは 4 区分のいずれか"

    - column: shift
      allowed_values:
        - "日勤"
        - "夜勤"
      description: "シフト区分は日勤・夜勤のいずれか"

  format_checks:
    - column: production_date
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      type: date
      description: "生産日は YYYY-MM-DD 形式"

    - column: line_id
      pattern: "^LINE-\\d{3}$"
      description: "製造ライン ID は LINE-001 形式"

    - column: product_code
      pattern: "^[A-Z]{2,4}-\\d{4,6}$"
      description: "製品コードは英字2〜4文字 + ハイフン + 数字4〜6桁"

    - column: equipment_id
      pattern: "^EQ-[A-Z]{2}-\\d{4}$"
      description: "設備 ID は EQ-XX-0000 形式"

    - column: operator_id
      pattern: "^OP-\\d{5}$"
      allow_null: true
      description: "作業者 ID は OP-00000 形式（NULL 許容）"

  type_checks:
    - column: planned_quantity
      expected_type: integer
      description: "計画数量は整数型"

    - column: actual_quantity
      expected_type: integer
      description: "実績数量は整数型"

    - column: defect_quantity
      expected_type: integer
      description: "不良数量は整数型"

    - column: temperature
      expected_type: double
      description: "温度は浮動小数点型"

    - column: vibration
      expected_type: double
      description: "振動値は浮動小数点型"

    - column: created_at
      expected_type: timestamp
      description: "作成日時はタイムスタンプ型"

# =============================================================================
# 品質閾値とアクション
# =============================================================================
thresholds:
  warning:
    score: 95.0
    description: "品質スコアが 95% 未満で警告（トレンド監視を開始）"
    action: "ログ出力 + Slack 通知（#data-quality チャンネル）"

  critical:
    score: 90.0
    description: "品質スコアが 90% 未満で重大アラート"
    action: "パイプライン一時停止 + PagerDuty アラート + 即時調査"

# =============================================================================
# 違反時の処理方針
# =============================================================================
on_violation:
  strategy: quarantine
  description: |
    品質違反レコードを隔離テーブル（quarantine.production_facts_errors）に分離し、
    正常レコードのみでパイプラインを継続する。
    エラーデータは削除せず、調査・修正後に再投入可能な状態で保存する。

  quarantine_table: quarantine.production_facts_errors
  include_metadata:
    - violation_type
    - violated_rule
    - violated_column
    - original_value
    - detected_at
    - pipeline_run_id

  continue_pipeline: true
  max_error_rate: 0.10
  max_error_rate_action: |
    エラー率が 10% を超えた場合はパイプライン全体を停止し、
    データソース（MES）側の異常を調査する。

# =============================================================================
# 品質スコアリング
# =============================================================================
quality_scoring:
  method: weighted_average
  description: "6次元の加重平均で品質スコアを算出する"

  weights:
    completeness: 1.0
    accuracy: 1.0
    consistency: 0.8
    timeliness: 0.8
    uniqueness: 1.0
    validity: 0.8

  grades:
    - grade: A
      min_score: 95
      label: "優秀"
      description: "正常。追加対応不要"
      action: "定常監視を継続"

    - grade: B
      min_score: 85
      label: "良好"
      description: "許容範囲。トレンド監視"
      action: "週次レポートで報告。悪化トレンドがあれば原因調査"

    - grade: C
      min_score: 70
      label: "要注意"
      description: "警告。原因調査と改善計画を策定"
      action: "品質管理担当に通知。1 週間以内に改善計画を策定"

    - grade: D
      min_score: 50
      label: "要改善"
      description: "要対応。データ利用者に影響あり"
      action: "データ利用者に品質低下を通知。ダッシュボードに警告表示"

    - grade: F
      min_score: 0
      label: "重大"
      description: "重大。パイプラインを停止して即座に対応"
      action: "パイプライン停止。エスカレーション。緊急対応チームを招集"
