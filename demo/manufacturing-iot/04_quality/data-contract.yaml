# =============================================================================
# 製造業 IoT デモ — データコントラクト
# Generated by: data-quality-reviewer agent
# =============================================================================

apiVersion: v1.0.0
kind: DataContract

# =============================================================================
# メタデータ
# =============================================================================
metadata:
  name: "production-facts-contract"
  display_name: "生産実績データコントラクト"
  version: "1.0.0"
  description: |
    製造実行システム（MES）から取得した日次生産実績データの契約定義。
    工場の生産ライン・設備・作業者の生産実績と IoT センサー値を含む。
  created_at: "2026-03-15"
  updated_at: "2026-03-15"

  producer:
    name: "MES"
    team: "製造部 生産管理課"
    contact: "mes-support@example.co.jp"
    description: "製造実行システム（Manufacturing Execution System）"

  consumer:
    - name: "BI Dashboard"
      team: "DX推進部 データ分析チーム"
      contact: "bi-team@example.co.jp"
      description: "工場長ダッシュボード・品質管理レポート"
      usage: "OLAP（日次・週次集計、不良率分析、設備稼働分析）"
      priority: high

    - name: "品質管理レポート"
      team: "品質保証部"
      contact: "qc-team@example.co.jp"
      description: "不良率分析・品質トレンド監視"
      usage: "OLAP（不良率の推移分析、異常検知）"
      priority: medium

    - name: "設備保全システム"
      team: "設備保全課"
      contact: "maintenance-team@example.co.jp"
      description: "予兆保全用の温度・振動トレンド分析"
      usage: "OLAP（設備センサー値のトレンド分析）"
      priority: medium

  tags:
    - manufacturing
    - production
    - iot
    - quality-control
    - predictive-maintenance

# =============================================================================
# スキーマ定義
# =============================================================================
schema:
  type: table
  name: silver.production_facts
  format: delta
  description: "Silver レイヤーの生産実績ファクトテーブル"

  fields:
    # --- 主キー構成カラム ---
    - name: production_date
      type: date
      required: true
      description: "生産日（YYYY-MM-DD 形式）"
      constraints:
        format: "YYYY-MM-DD"
        not_null: true
      examples:
        - "2026-03-14"
        - "2026-03-15"

    - name: line_id
      type: string
      required: true
      description: "製造ライン ID（LINE-001 形式）"
      constraints:
        not_null: true
        pattern: "^LINE-\\d{3}$"
      reference:
        table: master.production_lines
        column: line_id
      examples:
        - "LINE-001"
        - "LINE-012"

    - name: product_code
      type: string
      required: true
      description: "製品コード（英字2〜4文字 + ハイフン + 数字4〜6桁）"
      constraints:
        not_null: true
        pattern: "^[A-Z]{2,4}-\\d{4,6}$"
      reference:
        table: master.products
        column: product_code
      examples:
        - "AB-1234"
        - "XYZW-567890"

    - name: shift
      type: string
      required: true
      description: "シフト区分（日勤 / 夜勤）"
      constraints:
        not_null: true
        enum:
          - "日勤"
          - "夜勤"

    # --- 数量カラム ---
    - name: planned_quantity
      type: integer
      required: true
      description: "計画数量（生産計画上の目標数）"
      constraints:
        min: 0
        max: 100000
      examples:
        - 500
        - 1000

    - name: actual_quantity
      type: integer
      required: true
      description: "実績数量（実際に生産した良品 + 不良品の合計）"
      constraints:
        min: 0
        max: 100000
      examples:
        - 480
        - 1020

    - name: defect_quantity
      type: integer
      required: true
      description: "不良数量（検査で不良と判定された数）"
      constraints:
        min: 0
        max: 100000
      business_rule: "defect_quantity <= actual_quantity"
      examples:
        - 5
        - 12

    # --- 設備・作業者カラム ---
    - name: equipment_id
      type: string
      required: true
      description: "設備 ID（EQ-XX-0000 形式）"
      constraints:
        pattern: "^EQ-[A-Z]{2}-\\d{4}$"
      reference:
        table: master.equipment
        column: equipment_id
      examples:
        - "EQ-ML-0001"
        - "EQ-PR-0042"

    - name: operator_id
      type: string
      required: false
      description: "作業者 ID（OP-00000 形式。無人運転時は NULL）"
      constraints:
        pattern: "^OP-\\d{5}$"
        nullable: true
      reference:
        table: master.operators
        column: operator_id
      examples:
        - "OP-00123"
        - null

    # --- IoT センサーカラム ---
    - name: temperature
      type: double
      required: false
      description: "設備温度（℃）。IoT センサーから取得。センサー欠測時は NULL"
      constraints:
        min: 20.0
        max: 80.0
        nullable: true
        unit: "℃"
      examples:
        - 42.5
        - 65.3

    - name: vibration
      type: double
      required: false
      description: "振動値（mm/s）。IoT センサーから取得。センサー欠測時は NULL"
      constraints:
        min: 0.1
        max: 5.0
        nullable: true
        unit: "mm/s"
      examples:
        - 1.2
        - 3.8

    # --- ステータス・メタデータカラム ---
    - name: status
      type: string
      required: true
      description: "設備ステータス（正常 / 警告 / 異常 / 停止）"
      constraints:
        not_null: true
        enum:
          - "正常"
          - "警告"
          - "異常"
          - "停止"

    - name: created_at
      type: timestamp
      required: true
      description: "レコード作成日時（MES でのデータ生成時刻）"
      constraints:
        not_null: true
        format: "YYYY-MM-DD HH:mm:ss"

  primary_key:
    columns:
      - production_date
      - line_id
      - product_code
      - shift
    description: "生産日 + ライン + 製品 + シフトの複合キー"

  partitioning:
    columns:
      - production_date
    strategy: daily
    description: "生産日でパーティション分割（日次バッチに最適化）"

# =============================================================================
# 品質ルール（外部参照）
# =============================================================================
quality_rules:
  source: "./quality-rules.yaml"
  description: "6次元のデータ品質ルールは quality-rules.yaml で定義"

  summary:
    completeness:
      description: "必須カラムの NULL チェックとレコード件数検証"
      mandatory_columns: 13
      zero_null_tolerance_columns: 5

    accuracy:
      description: "数量・センサー値の範囲チェックとマスタ照合"
      range_checks: 5
      reference_checks: 4

    consistency:
      description: "カラム間の整合性チェック（数量関係、ステータス整合）"
      cross_field_rules: 4

    timeliness:
      description: "データ鮮度チェック（24 時間以内）と SLA 準拠検証"
      max_age_hours: 24

    uniqueness:
      description: "複合主キーの一意性チェックと近似重複検出"
      unique_key_columns: 4

    validity:
      description: "Enum 値チェック、正規表現フォーマットチェック、型チェック"
      enum_checks: 2
      format_checks: 5
      type_checks: 6

# =============================================================================
# SLA（サービスレベル合意）
# =============================================================================
sla:
  availability:
    target: "99.5%"
    measurement_period: monthly
    description: "月間 99.5% の可用性（月あたり最大 3.6 時間のダウンタイム許容）"
    exclusions:
      - "計画メンテナンス（毎月第 3 日曜 AM 2:00-6:00）"

  delivery_time:
    deadline: "08:00 JST"
    description: "毎日 AM 8:00 JST までに前日の生産実績データが Silver レイヤーで利用可能"
    max_delay: "2 時間"
    escalation: |
      AM 8:00 超過: Slack 通知（#data-pipeline チャンネル）
      AM 9:00 超過: データエンジニアに PagerDuty アラート
      AM 10:00 超過: マネージャーにエスカレーション

  data_quality:
    min_quality_score: 90
    grade: B
    description: "品質スコア B（90 点）以上を維持すること"

  freshness:
    max_staleness_hours: 24
    description: "データの鮮度は最大 24 時間。それ以上古いデータは異常とみなす"

  retention:
    hot_storage: "90 日"
    cold_storage: "3 年"
    description: |
      直近 90 日は Silver レイヤー（高速クエリ可能）。
      90 日以降は Archive レイヤー（コスト最適化ストレージ）に移動。
      3 年を超えるデータは社内規程に従い廃棄。

  support:
    response_time:
      critical: "30 分以内"
      warning: "4 時間以内"
      info: "翌営業日"
    contact:
      primary: "data-engineering@example.co.jp"
      escalation: "data-platform-manager@example.co.jp"

# =============================================================================
# 変更管理
# =============================================================================
change_management:
  notification_period: "7 日前"
  description: |
    スキーマ変更やデータフォーマット変更は、実施の 7 日前までに
    すべてのコンシューマーチームに通知すること。
  breaking_changes:
    - "カラムの削除"
    - "カラムの型変更"
    - "NOT NULL 制約の追加"
    - "Enum 値の削除"
  non_breaking_changes:
    - "カラムの追加（末尾）"
    - "Enum 値の追加"
    - "NULL 許容への変更"
    - "説明文の更新"
